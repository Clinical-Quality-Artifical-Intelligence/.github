name: Python / Streamlit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Check Streamlit app loads without error
        run: |
          # Verify the app can be imported (catches syntax errors and import failures)
          python -c "
          import ast, sys, pathlib
          app = pathlib.Path('app.py')
          if app.exists():
              ast.parse(app.read_text())
              print('app.py: syntax OK')
          "

      - name: Run tests (if present)
        run: |
          if [ -d "tests" ] || [ -f "test_*.py" ]; then
            pytest -v
          else
            echo "No test suite found — skipping. Consider adding tests in a tests/ directory."
          fi

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip install -r requirements.txt
          pip-audit --desc
